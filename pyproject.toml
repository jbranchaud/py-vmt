[project]
name = "visualmode-tracker"
version = "0.1.0"
description = "A command-line time tracker for your work sessions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Josh Branchaud", email = "jbranchaud@gmail.com" }]
keywords = ["cli", "time-tracking", "timer", "productivity", "tracker"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = ["click>=8.3.1", "dateparser>=1.3.0", "platformdirs>=4.9.4"]

[project.urls]
Homepage = "https://github.com/jbranchaud/py-vmt"
Repository = "https://github.com/jbranchaud/py-vmt"
Issues = "https://github.com/jbranchaud/py-vmt/issues"
[dependency-groups]
dev = [
  "basedpyright>=1.39.9",
  "freezegun>=1.5.5",
  "pytest>=9.0.2",
  "ruff>=0.15.20",
  "types-dateparser>=1.3.0.20260211",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_vmt"]

[project.scripts]
vmt = "py_vmt.cli:cli"

[tool.pytest.ini_options]
pythonpath = ["src"]
filterwarnings = [
  "ignore:Timezone offset does not match system offset:UserWarning",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
